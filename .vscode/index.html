<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follow Debbie — Interactive Story</title>
<style>
  :root {
    --gold: #d9a45b;
    --gold-bright: #f3c988;
    --ink: #1a1d26;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #0b0c10;
    overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
    user-select: none;
  }

  /* ===== Fixed 16:9 stage, scaled to fit window ===== */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1280px; height: 720px;
    transform: translate(-50%, -50%);
    transform-origin: center;
    box-shadow: 0 0 80px rgba(0,0,0,.8);
  }

  /* ===== Cover bg: slow breathing zoom ===== */
  .cover {
    position: absolute; inset: 0;
    background: url("assets/cover.png") center/cover no-repeat;
    animation: kenburns 24s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform: scale(1); }
    to   { transform: scale(1.08) translateX(-14px); }
  }
  /* Dark overlay for text readability */
  .cover-shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom, rgba(10,12,18,.55) 0%, rgba(10,12,18,.05) 40%, rgba(10,12,18,.72) 100%);
  }

  /* ===== Title area ===== */
  .title-wrap {
    position: absolute;
    left: 0; right: 0; top: 118px;
    text-align: center;
    animation: fadeDown 1.4s ease both;
  }
  .title-cn {
    font-size: 72px;
    letter-spacing: 8px;
    text-indent: 8px;
    color: #fff;
    font-weight: 700;
    text-shadow: 0 0 24px rgba(217,164,91,.45), 0 4px 18px rgba(0,0,0,.6);
  }
  .title-sub {
    margin-top: 18px;
    font-size: 17px;
    letter-spacing: 4px;
    color: rgba(255,255,255,.72);
  }
  .title-line {
    width: 340px; height: 1px; margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ===== Menu buttons ===== */
  .menu {
    position: absolute;
    left: 0; right: 0; bottom: 96px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    animation: fadeUp 1.4s .3s ease both;
  }
  .btn {
    width: 280px;
    padding: 13px 0;
    text-align: center;
    font-size: 20px;
    letter-spacing: 5px;
    text-indent: 5px;
    color: #f0e6d6;
    background: rgba(16,18,26,.55);
    border: 1px solid rgba(217,164,91,.55);
    border-radius: 4px;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: all .25s ease;
  }
  .btn:hover {
    color: #1a1d26;
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 0 26px rgba(217,164,91,.55);
    letter-spacing: 6px;
  }
  .btn.disabled { opacity: .35; cursor: default; }
  .btn.disabled:hover { color:#f0e6d6; background: rgba(16,18,26,.55); border-color: rgba(217,164,91,.55); box-shadow:none; letter-spacing:5px; }

  /* ===== Footer info ===== */
  .footer {
    position: absolute;
    left: 0; right: 0; bottom: 22px;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.35);
    animation: fadeUp 1.4s .6s ease both;
  }

  /* Transition flash */
  #fade {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s ease;
    z-index: 99;
  }
  #fade.on { opacity: 1; }

  @keyframes fadeDown { from { opacity:0; transform: translateY(-26px);} to { opacity:1; transform:none;} }
  @keyframes fadeUp   { from { opacity:0; transform: translateY(26px);}  to { opacity:1; transform:none;} }

  /* Top-corner control (when outside canvas) */
  .corner {
    position: fixed; top: 14px; right: 18px; z-index: 100;
    font-size: 12px; color: rgba(255,255,255,.4);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div class="corner">DEMO · UI PROTOTYPE</div>

  <div id="stage">
    <div class="cover"></div>
    <div class="cover-shade"></div>

    <div class="title-wrap">
      <div class="title-cn">FOLLOW DEBBIE</div>
      <div class="title-sub">A DAY IN THE LIFE OF AN AD PLANNER</div>
      <div class="title-line"></div>
    </div>

    <div class="menu">
      <div class="btn" onclick="startGame()">Start</div>
      <div class="btn disabled" id="btn-continue" onclick="continueGame()">Continue</div>
      <div class="btn" onclick="goAct2()">Act II</div>
    </div>

    <div class="footer">Interactive Story Demo · UI Prototype</div>

    <div id="fade"></div>
  </div>

<script>
  // ===== 16:9 stage scaling =====
  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    document.getElementById('stage').style.transform =
      `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // ===== Light up "Continue" when save exists =====
  if (localStorage.getItem('save_node')) {
    const b = document.getElementById('btn-continue');
    b.classList.remove('disabled');
  }

  function go(url) {
    const f = document.getElementById('fade');
    f.classList.add('on');
    setTimeout(() => location.href = url, 620);
  }
  function startGame()    { localStorage.removeItem('save_node'); go('game.html'); }
  function goAct2()       { go('game.html?node=j_open'); }
  function continueGame() {
    if (localStorage.getItem('save_node')) go('game.html');
  }
</script>
</body>
</html>
